name: Issues
on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const output = execSync('grep -rn "TODO\\|FIXME\\|HACK" --include="*.js" --include="*.ts" .').toString();
            
            for (const line of output.split('\n').filter(Boolean)) {
              const [location, ...rest] = line.split(':');
              const comment = rest.join(':').trim();
              
              // Check if issue already exists
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'todo-bot'
              });
              
              const alreadyExists = existing.data.some(i => i.title.includes(comment));
              if (alreadyExists) continue;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[TODO] ${comment.replace(/\/\/ TODO:?/, '').trim()}`,
                body: `**Found in:** \`${location}\`\n\n**Comment:**\n> ${comment}\n\n_Auto-generated by TODO scanner_`,
                labels: ['todo-bot', 'good first issue']
              });
            }
