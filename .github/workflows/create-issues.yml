name: Issue Generator
on:
  workflow_dispatch:
    inputs:
      context:
        description: 'Area to generate issues for (e.g. auth module, performance, docs)'
        required: true
        default: 'general codebase improvements'
      issue_count:
        description: 'Number of issues to generate (1-5)'
        required: true
        default: '3'

jobs:
  generate-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gemini SDK
        run: npm install @google/generative-ai

      - name: Generate and create issues
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { GoogleGenerativeAI } = require('@google/generative-ai');
            const fs = require('fs');
            const { execSync } = require('child_process');

            let fileTree = '';
            let sampleCode = '';
            let readme = '';

            try {
              fileTree = execSync(
                'find . -type f \\( -name "*.js" -o -name "*.ts" -o -name "*.py" -o -name "*.go" \\) ' +
                '! -path "*/node_modules/*" ! -path "*/.git/*" | head -30'
              ).toString().trim();
            } catch (e) {
              fileTree = 'Could not read file tree';
            }

            const codeFiles = fileTree.split('\n').slice(0, 5);
            for (const file of codeFiles) {
              if (!file) continue;
              try {
                const content = fs.readFileSync(file, 'utf8').slice(0, 500);
                sampleCode += `\n\n// ${file}\n${content}`;
              } catch (e) {}
            }

            try {
              readme = fs.readFileSync('README.md', 'utf8').slice(0, 1000);
            } catch (e) {
              readme = 'No README found';
            }

            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({ model: 'gemini-1.5-flash' });

            const prompt = `
              You are a senior software engineer creating GitHub issues to help new contributors onboard to a project easily.

              Project README:
              ${readme}

              File structure:
              ${fileTree}

              Sample code:
              ${sampleCode}

              Focus area: ${{ github.event.inputs.context }}
              Number of issues to generate: ${{ github.event.inputs.issue_count }}

              Generate exactly ${{ github.event.inputs.issue_count }} issues that are:
              - Scoped small enough to be completed in a single PR
              - Clear enough that a new contributor can pick them up without asking questions
              - Specific to the actual code and files visible above
              - Ordered from easiest to hardest

              Each issue body must include these sections:
              - Background: why this matters
              - What to change: specific files and what to do
              - Acceptance criteria: checkboxes a contributor can tick off
              - Effort: Small, Medium, or Large

              Labels must only be from this list: ["bug", "enhancement", "documentation", "good first issue", "help wanted", "refactor"]

              Respond with ONLY a valid JSON object, no markdown fences, no explanation:
              {
                "issues": [
                  {
                    "title": "issue title",
                    "body": "## Background\\n\\n...\\n\\n## What to Change\\n\\n...\\n\\n## Acceptance Criteria\\n\\n- [ ] ...\\n\\n## Effort\\n\\nSmall",
                    "labels": ["good first issue"]
                  }
                ]
              }
            `;

            const result = await model.generateContent(prompt);
            const rawText = result.response.text().trim();

            let parsed;
            try {
              const cleaned = rawText.replace(/^```json\n?/, '').replace(/\n?```$/, '').trim();
              parsed = JSON.parse(cleaned);
            } catch (e) {
              core.setFailed(`Failed to parse Gemini response: ${rawText}`);
              return;
            }

            if (!parsed.issues || !Array.isArray(parsed.issues)) {
              core.setFailed('Gemini response missing issues array');
              return;
            }

            const validLabels = ['bug', 'enhancement', 'documentation', 'good first issue', 'help wanted', 'refactor'];

            for (const issue of parsed.issues) {
              const safeLabels = (issue.labels || []).filter(l => validLabels.includes(l));

              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: safeLabels
                });

                console.log(`Created issue #${created.data.number}: ${issue.title}`);
              } catch (e) {
                console.error(`Failed to create issue "${issue.title}": ${e.message}`);
              }
            }
